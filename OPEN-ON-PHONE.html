<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NILE RUSH — Browser Edition</title>
<meta name="theme-color" content="#070e26">
<style>/* NILE RUSH — interface styles. Palette: lapis, gold, faience turquoise, carnelian. Mobile first. */
:root {
  --lapis: #0f1f4b; --lapis-2: #16306e; --night: #070e26; --gold: #f2b84b; --gold-2: #ffdf8a; --gold-d: #b47a16;
  --turq: #22c3b4; --turq-d: #128a80; --carn: #e0503a; --sand: #f4e6c4; --muted: #a9b3d2; --ok: #46d17a; --bad: #ff6a5a;
  --u: clamp(11px, 1.55vmin + 6px, 20px);
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  --font: ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, "Noto Sans", "Noto Naskh Arabic", "DejaVu Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--sand); font: 600 var(--u)/1.35 var(--font); overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#touch { position: absolute; inset: 0; z-index: 5; touch-action: none; display: none; }
#touch.on { display: block; }
#ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.vignette { position: absolute; inset: 0; z-index: 6; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 8, 24, .45) 100%); opacity: 0; transition: opacity .3s; }
.vignette.on { opacity: 1; }
.dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 10, 30, .65), rgba(5, 10, 30, .35) 40%, rgba(5, 10, 30, .75)); }
svg { display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--turq); outline-offset: 2px; }

.screen { position: absolute; inset: 0; display: none; padding: calc(var(--sat) + .8em) calc(var(--sar) + .9em) calc(var(--sab) + .8em) calc(var(--sal) + .9em); pointer-events: auto; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }
.screen.passthrough { pointer-events: none; }
.screen.passthrough > * { pointer-events: auto; }

/* ---------- buttons ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55em; min-height: 2.9em; padding: .55em 1.2em; border: 2px solid var(--gold-d); border-radius: .8em; background: linear-gradient(180deg, var(--lapis-2), var(--lapis)); color: var(--sand); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 .2em 0 rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255, 223, 138, .18); transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(.12em); box-shadow: 0 .08em 0 rgba(0, 0, 0, .35); }
.btn svg { font-size: 1.25em; flex: none; }
.btn.primary { background: linear-gradient(180deg, #ffe08a, #f2b84b 55%, #d98f1c); color: #2a1a02; border-color: #fff1c2; text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
.btn.danger { background: linear-gradient(180deg, #f0745a, #c73b28); border-color: #ffb3a3; color: #fff; }
.btn.turq { background: linear-gradient(180deg, #3fe0cf, #13998c); color: #032b27; border-color: #b6fff6; }
.btn.small { min-height: 2.3em; padding: .35em .9em; font-size: .85em; }
.btn[disabled], .btn.off { filter: grayscale(.9) brightness(.75); cursor: not-allowed; }
.btn.icon { min-width: 2.9em; padding: .5em; }
.btn.play { font-size: 1.7em; min-height: 2.5em; padding: .4em 1.6em; border-radius: .5em; clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); border: 0; box-shadow: none; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.14); } }
.badge { display: inline-block; min-width: 1.5em; padding: .05em .45em; border-radius: 1em; background: var(--carn); color: #fff; font-size: .75em; text-align: center; letter-spacing: 0; }
.wallet { display: inline-flex; align-items: center; gap: .4em; padding: .3em .8em; border-radius: 2em; background: rgba(7, 14, 38, .72); border: 1.5px solid var(--gold-d); font-weight: 800; }
.wallet svg { font-size: 1.3em; }
.muted { color: var(--muted); }
.gold { color: var(--gold); }

/* ---------- splash / loading ---------- */
#screen-splash { align-items: center; justify-content: center; text-align: center; gap: 1.2em; background: radial-gradient(ellipse at 50% 35%, #1a3a86 0%, #0a1740 55%, #050a1e 100%); }
#screen-splash .logo { width: min(78vw, 26em, 60vh); height: auto; filter: drop-shadow(0 .5em 1.2em rgba(0, 0, 0, .5)); }
.loadbar { width: min(60vw, 20em); height: .6em; border-radius: 1em; background: rgba(255, 255, 255, .12); overflow: hidden; }
.loadbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--turq), var(--gold)); transition: width .2s; }
.splash-note { font-size: .85em; max-width: 30em; }
.err { color: var(--bad); max-width: 28em; }

/* ---------- intro ---------- */
#screen-intro { padding: 0; pointer-events: none; background: transparent; }
#screen-intro .black { position: absolute; inset: 0; background: #02040d; animation: introBlack 7.2s forwards; pointer-events: none; }
@keyframes introBlack { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
.card { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; opacity: 0; padding: 0 1em; pointer-events: none; }
.card.c1 { animation: cardIn 2.3s .3s forwards; }
.card.c2 { animation: cardIn 2.1s 2.5s forwards; }
.card.c3 { animation: cardIn 2.4s 4.4s forwards; }
@keyframes cardIn { 0% { opacity: 0; transform: translateY(-46%) scale(.96); } 18% { opacity: 1; transform: translateY(-50%) scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-53%) scale(1.02); } }
.card .logo { width: min(74vw, 30em, 56vh); height: auto; margin: 0 auto; }
.card .ar { font-size: clamp(1.6em, 6.4vw, 3.2em); font-weight: 800; color: var(--gold-2); text-shadow: 0 .1em .5em rgba(0, 0, 0, .6); direction: rtl; }
.card .en { font-size: clamp(1.2em, 4.6vw, 2.4em); font-weight: 700; color: var(--sand); letter-spacing: .04em; text-shadow: 0 .1em .5em rgba(0, 0, 0, .6); }
.card .rule { width: 6em; height: 3px; margin: .8em auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.lower { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 1.6em); text-align: center; opacity: 0; animation: lowerIn 1.2s 6.6s forwards; pointer-events: none; text-shadow: 0 .1em .5em #000; }
@keyframes lowerIn { to { opacity: 1; } }
.lower .ar { font-size: 1.15em; font-weight: 800; color: var(--gold-2); direction: rtl; }
.lower .en { font-size: .95em; opacity: .9; }
.skip { position: absolute; top: calc(var(--sat) + .9em); right: calc(var(--sar) + .9em); z-index: 3; pointer-events: auto; }

/* ---------- menu ---------- */
#screen-menu { justify-content: space-between; }
.menu-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .8em; }
.menu-top .logo { width: min(38vw, 11em); height: auto; filter: drop-shadow(0 .3em .6em rgba(0, 0, 0, .55)); }
.menu-stats { display: flex; flex-direction: column; align-items: flex-end; gap: .4em; }
.menu-body { flex: 1; min-height: 0; display: flex; align-items: flex-end; }
.nav { display: flex; flex-direction: column; gap: .6em; width: 100%; }
.nav .row { display: grid; grid-template-columns: 1fr 1fr; gap: .55em; }
.nav .btn { justify-content: flex-start; padding-left: 1em; }
.nav .btn .badge { margin-left: auto; }
.nav .btn.play { justify-content: center; }
.loadout { display: flex; gap: .5em; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: .4em; padding: .35em .8em; border-radius: 2em; border: 2px solid rgba(255, 255, 255, .22); background: rgba(7, 14, 38, .7); font-weight: 700; font-size: .85em; }
.chip.on { border-color: var(--turq); background: rgba(19, 153, 140, .45); color: #fff; }
.chip[disabled] { opacity: .5; }
.who { display: flex; flex-direction: column; align-items: center; text-align: center; text-shadow: 0 .1em .4em #000; font-size: .9em; }
.who b { font-size: 1.35em; color: var(--gold-2); }
@media (min-aspect-ratio: 23/20) {
  .menu-body { align-items: center; }
  .nav { width: min(23em, 42vw); }
  .menu-top .logo { width: min(24vw, 15em); }
}

/* ---------- panels (characters / missions / achievements / shop / settings / credits) ---------- */
.topbar { display: flex; align-items: center; gap: .7em; margin-bottom: .7em; }
.topbar h2 { margin: 0; flex: 1; font-size: 1.45em; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-2); text-shadow: 0 .08em .3em rgba(0, 0, 0, .6); }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 2px solid var(--gold-d); border-radius: 1.1em; background: linear-gradient(180deg, rgba(15, 31, 75, .93), rgba(7, 14, 38, .95)); box-shadow: 0 1em 3em rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 223, 138, .16); overflow: hidden; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: .9em; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
.list { display: flex; flex-direction: column; gap: .7em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15em), 1fr)); gap: .7em; }
.item { display: flex; align-items: center; gap: .8em; padding: .75em; border-radius: .9em; background: rgba(255, 255, 255, .06); border: 1.5px solid rgba(255, 255, 255, .1); min-width: 0; }
.item.done { border-color: var(--ok); background: rgba(70, 209, 122, .12); }
.item.locked { opacity: .68; }
.item .ico { flex: none; width: 2.7em; height: 2.7em; border-radius: .7em; display: grid; place-items: center; background: rgba(0, 0, 0, .3); font-size: 1.1em; }
.item .txt { flex: 1; min-width: 0; }
.item .t { font-weight: 800; overflow-wrap: anywhere; }
.item .d { font-size: .82em; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.item .r { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: .3em; }
.bar { height: .6em; border-radius: 1em; background: rgba(255, 255, 255, .13); overflow: hidden; margin-top: .35em; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 1em; background: linear-gradient(90deg, var(--turq), var(--gold)); }
.swatch { width: 100%; height: 100%; border-radius: inherit; }
.price { display: inline-flex; align-items: center; gap: .3em; font-weight: 800; }
.price svg { font-size: 1.15em; }
.tabs { display: flex; gap: .4em; padding: .6em .9em 0; overflow-x: auto; flex: none; scrollbar-width: none; touch-action: pan-x; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: .5em 1em; border-radius: 2em; border: 1.5px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .05); font-weight: 800; }
.tab.on { background: var(--gold); color: #2a1a02; border-color: #fff1c2; }
.sec { margin: 1em 0 .5em; font-size: .9em; color: var(--gold-2); letter-spacing: .08em; text-transform: uppercase; }
.sec:first-child { margin-top: 0; }
.pips { display: inline-flex; gap: .2em; }
.pips i { width: .7em; height: .7em; border-radius: 50%; background: rgba(255, 255, 255, .2); }
.pips i.on { background: var(--gold); }

/* ---------- characters ---------- */
#screen-chars { justify-content: space-between; }
.chars-panel { border: 2px solid var(--gold-d); border-radius: 1.1em; background: linear-gradient(180deg, rgba(15, 31, 75, .9), rgba(7, 14, 38, .94)); padding: .9em; display: flex; flex-direction: column; gap: .6em; max-height: 58%; overflow-y: auto; touch-action: pan-y; }
.chars-head { display: flex; align-items: center; gap: .6em; }
.chars-head .nm { flex: 1; text-align: center; }
.chars-head .nm b { display: block; font-size: 1.5em; color: var(--gold-2); line-height: 1.1; }
.stat { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; gap: .6em; font-size: .88em; }
.stat .bar { margin: 0; }
.skins { display: flex; gap: .5em; flex-wrap: wrap; align-items: center; }
.dot { width: 2em; height: 2em; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .3); padding: 0; }
.dot.on { border-color: var(--gold-2); box-shadow: 0 0 0 2px var(--gold-d); }
.dot.lockd { opacity: .4; }
@media (min-aspect-ratio: 23/20) { #screen-chars .chars-panel { width: min(26em, 44vw); max-height: none; align-self: flex-start; margin-top: 0; } #screen-chars { align-items: flex-start; } }

/* ---------- settings ---------- */
.set { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: .65em 0; border-bottom: 1px solid rgba(255, 255, 255, .08); flex-wrap: wrap; }
.set:last-child { border-bottom: 0; }
.set label { font-weight: 800; }
.range { -webkit-appearance: none; appearance: none; width: min(14em, 100%); height: .7em; border-radius: 1em; background: rgba(255, 255, 255, .18); outline-offset: 6px; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--gold); border: 3px solid #fff1c2; }
.range::-moz-range-thumb { width: 1.4em; height: 1.4em; border-radius: 50%; background: var(--gold); border: 3px solid #fff1c2; }
.seg { display: inline-flex; border: 2px solid var(--gold-d); border-radius: .8em; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: .45em .9em; font-weight: 800; }
.seg button.on { background: var(--gold); color: #2a1a02; }
.tog { width: 3.4em; height: 1.9em; border-radius: 2em; border: 2px solid var(--gold-d); background: rgba(255, 255, 255, .12); position: relative; padding: 0; }
.tog::after { content: ""; position: absolute; top: .18em; left: .2em; width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.tog.on { background: var(--turq-d); }
.tog.on::after { transform: translateX(1.5em); background: #fff; }

/* ---------- credits ---------- */
.credits { text-align: center; padding: 1.2em .6em 2em; display: flex; flex-direction: column; align-items: center; gap: .9em; }
.credits .logo { width: min(70%, 18em); height: auto; }
.credits .ar { font-size: 1.7em; font-weight: 800; color: var(--gold-2); direction: rtl; }
.credits .en { font-size: 1.2em; font-weight: 700; }
.credits .eng { font-size: 1.05em; color: var(--turq); font-weight: 800; letter-spacing: .05em; }
.credits p { margin: 0; max-width: 32em; color: var(--muted); font-weight: 600; font-size: .9em; }

/* ---------- tutorial ---------- */
#screen-tutorial { align-items: center; justify-content: center; background: rgba(4, 8, 24, .82); }
.tut { width: min(100%, 30em); max-height: 100%; overflow-y: auto; border: 2px solid var(--gold-d); border-radius: 1.2em; background: linear-gradient(180deg, var(--lapis-2), var(--night)); padding: 1.1em; text-align: center; display: flex; flex-direction: column; gap: .8em; }
.tut h3 { margin: 0; font-size: 1.4em; color: var(--gold-2); }
.tut p { margin: 0; color: var(--sand); }
.keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6em; }
.key { display: flex; align-items: center; gap: .6em; padding: .55em .7em; border-radius: .8em; background: rgba(255, 255, 255, .07); text-align: left; font-weight: 800; }
.key .k { flex: none; width: 2.3em; height: 2.3em; display: grid; place-items: center; border-radius: .5em; background: var(--gold); color: #2a1a02; font-size: 1.1em; }
.key small { display: block; font-weight: 600; color: var(--muted); font-size: .78em; }
.dots { display: flex; justify-content: center; gap: .4em; }
.dots i { width: .6em; height: .6em; border-radius: 50%; background: rgba(255, 255, 255, .25); }
.dots i.on { background: var(--gold); }
.tut-row { display: flex; gap: .6em; justify-content: space-between; }
.demo { display: flex; justify-content: center; gap: 1em; flex-wrap: wrap; font-size: 2.2em; }

/* ---------- HUD ---------- */
#screen-hud { padding: calc(var(--sat) + .6em) calc(var(--sar) + .8em) calc(var(--sab) + .7em) calc(var(--sal) + .8em); pointer-events: none; justify-content: space-between; }
#screen-hud .btn, #screen-hud button { pointer-events: auto; }
.hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .6em; }
.hud-score { text-shadow: 0 .1em .3em rgba(0, 0, 0, .8); min-width: 0; }
.hud-score .s { font-size: 2em; font-weight: 900; line-height: 1; letter-spacing: .02em; color: #fff; font-variant-numeric: tabular-nums; }
.hud-score .b { font-size: .78em; color: var(--gold-2); font-weight: 800; }
.hud-mid { text-align: center; font-weight: 900; font-size: 1.1em; text-shadow: 0 .1em .3em #000; padding-top: .2em; font-variant-numeric: tabular-nums; }
.hud-mid small { display: block; font-size: .7em; color: var(--gold-2); }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: .45em; }
.hud-right .row { display: flex; align-items: center; gap: .5em; }
.hud-coins { display: inline-flex; align-items: center; gap: .35em; padding: .25em .75em; border-radius: 2em; background: rgba(7, 14, 38, .7); border: 1.5px solid var(--gold-d); font-weight: 900; font-variant-numeric: tabular-nums; transition: transform .1s; }
.hud-coins.bump { transform: scale(1.12); }
.hud-coins svg { font-size: 1.3em; }
.hud-pause { width: 2.6em; height: 2.6em; border-radius: 50%; border: 2px solid var(--gold-d); background: rgba(7, 14, 38, .7); display: grid; place-items: center; padding: 0; }
.hud-side { position: absolute; left: calc(var(--sal) + .8em); top: 5.6em; display: flex; flex-direction: column; gap: .4em; }
.pu { display: none; align-items: center; gap: .45em; padding: .2em .7em .2em .3em; border-radius: 2em; background: rgba(7, 14, 38, .72); border: 1.5px solid rgba(255, 255, 255, .25); min-width: 7.2em; }
.pu.on { display: flex; }
.pu .i { font-size: 1.5em; flex: none; }
.pu .bar { flex: 1; margin: 0; height: .5em; }
.pu .bar i { background: var(--c, var(--turq)); }
.combo { position: absolute; left: calc(var(--sal) + .8em); top: 3.9em; text-shadow: 0 .1em .3em #000; opacity: 0; transition: opacity .2s; }
.combo.on { opacity: 1; }
.combo b { font-size: 1.5em; color: var(--gold-2); font-weight: 900; }
.combo .bar { width: 6em; height: .4em; margin-top: .1em; }
.hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: .6em; }
.act { position: relative; width: 4.4em; height: 4.4em; border-radius: 50%; border: 3px solid var(--gold-d); background: radial-gradient(circle at 35% 30%, #27407f, #0d1a44); display: grid; place-items: center; padding: 0; font-size: 1em; box-shadow: 0 .2em .8em rgba(0, 0, 0, .5); }
.act svg { font-size: 2.1em; }
.act .cnt { position: absolute; right: -.2em; top: -.2em; min-width: 1.6em; height: 1.6em; padding: 0 .3em; border-radius: 1em; background: var(--carn); color: #fff; font-size: .75em; display: grid; place-items: center; font-weight: 900; }
.act .ring { position: absolute; inset: -4px; border-radius: 50%; background: conic-gradient(var(--turq) calc(var(--p, 0) * 1%), rgba(255, 255, 255, .0) 0); -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%); mask: radial-gradient(circle, transparent 60%, #000 62%); }
.act.ready { border-color: #fff1c2; box-shadow: 0 0 1.2em var(--gold), 0 .2em .8em rgba(0, 0, 0, .5); animation: pulse 1s infinite; }
.act.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-.25em); } 75% { transform: translateX(.25em); } }
.pad { display: none; gap: .5em; }
body.buttons .pad { display: grid; }
.pad { grid-template-columns: repeat(3, 3.2em); grid-template-rows: repeat(2, 3.2em); }
.pad button { border-radius: .8em; border: 2px solid var(--gold-d); background: rgba(7, 14, 38, .6); display: grid; place-items: center; padding: 0; }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
.popups { position: absolute; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: .3em; pointer-events: none; }
.pop { font-weight: 900; font-size: 1.3em; color: #fff; text-shadow: 0 .1em .4em #000, 0 0 .6em var(--gold); animation: pop 1.1s forwards; letter-spacing: .04em; }
@keyframes pop { 0% { opacity: 0; transform: translateY(.6em) scale(.8); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-1.4em); } }
#announce { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; opacity: 0; text-shadow: 0 .1em .5em #000; z-index: 4; }
#announce.on { animation: ann 3.2s forwards; }
#announce .en { font-size: 1.9em; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
#announce .ar { font-size: 1.3em; font-weight: 800; color: var(--gold-2); direction: rtl; }
@keyframes ann { 0% { opacity: 0; transform: scale(.94); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-.5em); } }
#toasts { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 6.5em); display: flex; flex-direction: column; align-items: center; gap: .4em; pointer-events: none; z-index: 30; padding: 0 1em; }
.toast { max-width: 100%; padding: .5em 1.1em; border-radius: 2em; background: rgba(7, 14, 38, .92); border: 2px solid var(--turq); font-weight: 800; text-align: center; animation: toast 3s forwards; }
.toast.gold { border-color: var(--gold); color: var(--gold-2); } .toast.warn { border-color: var(--bad); } .toast.good { border-color: var(--ok); } .toast.power { border-color: var(--gold-2); }
@keyframes toast { 0% { opacity: 0; transform: translateY(.8em); } 10% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- pause / game over ---------- */
#screen-pause, #screen-over, #screen-modal { align-items: center; justify-content: center; background: rgba(4, 8, 24, .78); }
.dialog { width: min(100%, 27em); max-height: 100%; overflow-y: auto; border: 2px solid var(--gold-d); border-radius: 1.2em; background: linear-gradient(180deg, var(--lapis-2), var(--night)); padding: 1.1em; display: flex; flex-direction: column; gap: .7em; text-align: center; touch-action: pan-y; }
.dialog h2 { margin: 0; font-size: 1.7em; letter-spacing: .08em; color: var(--gold-2); text-transform: uppercase; }
.dialog .btn { width: 100%; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; }
.res div { padding: .5em; border-radius: .8em; background: rgba(255, 255, 255, .07); }
.res b { display: block; font-size: 1.35em; color: #fff; font-variant-numeric: tabular-nums; }
.res small { color: var(--muted); font-weight: 700; }
.res .big { grid-column: 1 / -1; background: rgba(242, 184, 75, .14); border: 1.5px solid var(--gold-d); }
.res .big b { font-size: 2.3em; color: var(--gold-2); }
.newbest { display: inline-block; margin-left: .4em; padding: .1em .6em; border-radius: 1em; background: var(--carn); color: #fff; font-size: .35em; vertical-align: middle; letter-spacing: .08em; }
.mini { text-align: left; display: flex; flex-direction: column; gap: .45em; }
.mini .m { font-size: .85em; }
.mini .bar { margin-top: .15em; }
.hint { font-size: .8em; color: var(--muted); font-weight: 600; }
@media (max-height: 430px) { .dialog { padding: .7em; gap: .45em; } .btn.play { font-size: 1.3em; } .menu-top .logo { width: 7em; } }
@media (prefers-reduced-motion: reduce) { .btn.play, .act.ready, .pop, .toast { animation-duration: .01ms !important; } .btn.play, .act.ready { animation: none; } }
</style>
